name: Build — apex-psi-mcp

# The guard rail. Runs on every push to main that touches the server, its manifest or
# the directory card: it proves the TypeScript compiles and that the compiled MCP server
# actually loads. It cannot publish and cannot reach any credential, which is the point —
# publishing is a separate rail (publish-npm.yml) that only a version tag opens.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "server.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: node -e "require('./dist/index.js'); console.log('dist loadable')"
      - name: The advertised default call must work against the live endpoint
        run: node scripts/anchor-tool-check.mjs
      - name: No card file may carry a phrase the repository has cut
        run: node scripts/card-copy-check.mjs
      # The card guard gained the withdrawn metaphors on 16 Nov (black box, flight recorder,
      # world's first, tamper-proof, immutable, multi-party computation). A guard nobody has seen
      # fail is not a guard, so it refuses each of them on demand.
      - name: Prove the card guard bites, using its own self-test
        run: node scripts/card-copy-check.mjs --self-test
      # Cut 24 Oct: the official registry's copy of us was two months stale and promised an
      # `audit` tool this server has never had, and no guard here could see it because every
      # guard read only this repository. This one reads the card against the built server.
      - name: The directory card must be publishable and must name only real tools
        run: node scripts/registry-card-check.mjs
      - name: Prove the card guard bites, using its own self-test
        run: node scripts/registry-card-check.mjs --self-test
      # The gate is the answer to "an agent may simply never call seal". It counts
      # only if the built module refuses an action whose seal failed, so this runs
      # against dist/gate.js — the file a stranger installs — with no network.
      - name: The execution gate must refuse an action whose seal failed
        run: node scripts/gate-check.mjs

  # server.json is published on GitHub raw, so a stranger can read it. If it names a
  # package version the registry does not serve, the card is a broken promise, and the
  # failure appears only when someone tries to install. So the manifest is checked here,
  # against the live registry, on every push.
  card-matches-registry:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: server.json must name a version npm serves
        run: |
          node -e '
            const fs = require("fs");
            const card = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const pkg = card.packages[0];
            if (card.version !== pkg.version) {
              console.error("STOP: card version " + card.version + " and package version " + pkg.version + " disagree");
              process.exit(1);
            }
            fetch("https://registry.npmjs.org/" + pkg.identifier)
              .then((r) => r.json())
              .then((d) => {
                if (!d.versions || !d.versions[pkg.version]) {
                  console.error("STOP: npm does not serve " + pkg.identifier + "@" + pkg.version + " — the card promises an install that cannot happen");
                  process.exit(1);
                }
                console.log("ok: npm serves " + pkg.identifier + "@" + pkg.version);
              });
          '
